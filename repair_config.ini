[Tolerances]
# Below this area → degenerate face
area_tolerance = 1e-12

# Vertex merge distance
merge_tolerance = 1e-6

# SVD flatness ratio for hole filling
planar_tolerance = 1e-4

# Stored-vs-computed flip threshold for normals
normal_angle_tol_deg = 90.0

[Shells]
# Optional filtering of small open components. Closed parts are always retained.
filter_shells = False

# Candidate filtering threshold; the original-surface acceptance gate still applies.
shell_area_threshold = 0.002

[NonManifold]
# How many faces to keep per edge (usually 2)
max_faces_per_edge = 2

[Welding]
# Merge naked-edge vertices closer than this
boundary_weld_tolerance = 1e-3

[Mobius]
# Max number of edges to split to resolve non-orientability
max_mobius_crack = 1000



[Union]
enabled = false
# Optional declaration that nesting alternates material and voids.
# Default preserves the material roles represented by the source winding.
hollow = false

# Legacy helper selector. Tiers 1/2 use Manifold64; tier 3 cannot verify a union.
# force_tier = 

# Legacy diagnostic setting; sampled rays never establish repair success.
sample_ratio = 0.2

[Preservation]
# World-coordinate distance budget. Zero forbids intentional surface movement.
max_surface_deviation = 0
preserve_cavities = true

[Execution]
timeout_seconds = 120
backend_enabled = true

